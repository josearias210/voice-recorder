name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Publica los hallazgos en la pestaña Security → Code scanning.
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Revisa TODO el historial (no solo el último commit): un secreto borrado
      # en un commit posterior sigue siendo público en el historial de git.
      - name: Gitleaks (todo el historial)
        run: >-
          docker run --rm -v "${{ github.workspace }}:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner --exit-code 1
          --report-format sarif --report-path /repo/gitleaks.sarif

      # Los PR desde forks no tienen permiso de escritura: ahí solo falla el
      # paso anterior, que es el que bloquea el PR.
      - name: Upload gitleaks report
        if: always() && hashFiles('gitleaks.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  build-test:
    name: Build & Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build VoiceRecorder.slnx -c Release -warnaserror --nologo

      - name: Test
        run: >-
          dotnet test --project tests/VoiceRecorder.Tests -c Release --no-build --output Detailed
          --report-xunit-trx --report-xunit-trx-filename windows.trx
          --results-directory "artifacts/test-results"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ github.sha }}
          path: artifacts/test-results/**/*.trx
          retention-days: 14
          if-no-files-found: error

      - name: Publish (portable build)
        run: dotnet publish src/VoiceRecorder.App/VoiceRecorder.App.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Smoke test del portable
        shell: pwsh
        run: |
          $required = @(
            'publish/VoiceRecorder.exe',
            'publish/VoiceRecorder.dll',
            'publish/VoiceRecorder.Transcription.dll',
            'publish/VoiceRecorder.Audio.dll',
            'publish/VoiceRecorder.Storage.dll',
            'publish/Whisper.net.dll',
            'publish/onnxruntime.dll',
            'publish/e_sqlite3.dll'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Faltan ensamblados en el portable: $($missing -join ', ')" }
          Write-Host "Portable OK: $((Get-ChildItem publish | Measure-Object).Count) archivos"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: VoiceRecorder-portable-${{ github.sha }}
          path: publish/
          retention-days: 14

  # Prueba E2E de humo: el portable recién compilado arranca, carga su
  # ventana principal y se adjunta una captura de pantalla al PR.
  e2e-smoke:
    name: E2E · la app arranca (captura)
    needs: build-test
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      # Escritura solo para publicar la captura (rama e2e-screenshots) y
      # comentarla en el PR; en PR de forks o de Dependabot el token es de
      # solo lectura y esos pasos se omiten.
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download portable build
        uses: actions/download-artifact@v8
        with:
          name: VoiceRecorder-portable-${{ github.sha }}
          path: publish

      - name: Arrancar la app y capturar la pantalla
        shell: pwsh
        run: ./scripts/e2e-smoke.ps1 -AppPath publish/VoiceRecorder.exe -OutDir artifacts/e2e -AcceptLegalNotice

      - name: Resumen del job
        if: always() && hashFiles('artifacts/e2e/report.md') != ''
        shell: pwsh
        run: Get-Content artifacts/e2e/report.md | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshot-${{ github.sha }}
          path: artifacts/e2e/
          retention-days: 14
          if-no-files-found: warn

      - name: Publicar la captura en el PR
        if: >-
          always() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
          && hashFiles('artifacts/e2e/app.png') != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $branch = 'e2e-screenshots'
          $file = "pr-$env:PR_NUMBER/$env:HEAD_SHA.png"

          # Las capturas se guardan en una rama aparte (sin historial del código)
          # para poder enlazarlas como imagen en el comentario.
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --depth 1 origin $branch 2>$null
          if ($LASTEXITCODE -eq 0) {
            git worktree add shots FETCH_HEAD
            Push-Location shots
            git checkout -B $branch
          }
          else {
            git worktree add --detach shots
            Push-Location shots
            git checkout --orphan $branch
            git rm -rf --quiet .
          }
          New-Item -ItemType Directory -Force -Path (Split-Path $file) | Out-Null
          Copy-Item ../artifacts/e2e/app.png $file
          git add $file
          git commit --quiet -m "E2E: captura de PR #$env:PR_NUMBER ($env:HEAD_SHA)"
          git push --quiet origin "HEAD:$branch"
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo publicar la captura.' }
          Pop-Location

          $report = Get-Content artifacts/e2e/report.md -Raw
          $marker = '<!-- e2e-smoke -->'
          $image = "https://raw.githubusercontent.com/$env:REPO/$branch/$file"
          $body = "$marker`n$report`n![Captura de Voice Recorder]($image)`n`nCommit $env:HEAD_SHA · [ejecución]($env:RUN_URL)"

          # Un único comentario por PR, actualizado en cada ejecución.
          $existing = gh api "repos/$env:REPO/issues/$env:PR_NUMBER/comments" --paginate --jq ".[] | select(.body | startswith(`"$marker`")) | .id" | Select-Object -First 1
          $payload = @{ body = $body } | ConvertTo-Json
          if ($existing) {
            $payload | gh api -X PATCH "repos/$env:REPO/issues/comments/$existing" --input - | Out-Null
          }
          else {
            $payload | gh api -X POST "repos/$env:REPO/issues/$env:PR_NUMBER/comments" --input - | Out-Null
          }
