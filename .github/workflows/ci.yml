name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# El escaneo de secretos y la auditoría de workflows están en security.yml.
jobs:
  build-test:
    name: Build & Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build VoiceRecorder.slnx -c Release -warnaserror --nologo

      - name: Test
        run: >-
          dotnet test --project tests/VoiceRecorder.Tests -c Release --no-build --output Detailed
          --report-xunit-trx --report-xunit-trx-filename windows.trx
          --results-directory "artifacts/test-results"

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ github.sha }}
          path: artifacts/test-results/**/*.trx
          retention-days: 14
          if-no-files-found: error

      - name: Publish (portable build)
        run: dotnet publish src/VoiceRecorder.App/VoiceRecorder.App.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Smoke test del portable
        shell: pwsh
        run: |
          $required = @(
            'publish/VoiceRecorder.exe',
            'publish/VoiceRecorder.dll',
            'publish/VoiceRecorder.Transcription.dll',
            'publish/VoiceRecorder.Audio.dll',
            'publish/VoiceRecorder.Storage.dll',
            'publish/Whisper.net.dll',
            'publish/onnxruntime.dll',
            'publish/e_sqlite3.dll'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Faltan ensamblados en el portable: $($missing -join ', ')" }
          Write-Host "Portable OK: $((Get-ChildItem publish | Measure-Object).Count) archivos"

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VoiceRecorder-portable-${{ github.sha }}
          path: publish/
          retention-days: 14

  # Prueba E2E de humo: el portable recién compilado arranca, recorre sus
  # pantallas (principal, configuración y sus diálogos, chat de una sesión de
  # demostración) y se adjunta una captura de cada una al PR.
  e2e-smoke:
    name: E2E · la app arranca (capturas de pantallas)
    needs: build-test
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      # Escritura solo para publicar la captura (rama e2e-screenshots) y
      # comentarla en el PR; en PR de forks o de Dependabot el token es de
      # solo lectura y esos pasos se omiten.
      contents: write
      pull-requests: write
    steps:
      # Conserva la credencial: el paso «Publicar las capturas en el PR» hace git push.
      - name: Checkout # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download portable build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: VoiceRecorder-portable-${{ github.sha }}
          path: publish

      - name: Arrancar la app y capturar las pantallas
        shell: pwsh
        run: ./scripts/e2e-smoke.ps1 -AppPath publish/VoiceRecorder.exe -OutDir artifacts/e2e -AcceptLegalNotice

      - name: Resumen del job
        if: always() && hashFiles('artifacts/e2e/report.md') != ''
        shell: pwsh
        run: Get-Content artifacts/e2e/report.md | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots-${{ github.sha }}
          path: artifacts/e2e/
          retention-days: 14
          if-no-files-found: warn

      - name: Publicar las capturas en el PR
        if: >-
          always() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
          && hashFiles('artifacts/e2e/screens.json') != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $branch = 'e2e-screenshots'
          $folder = "pr-$env:PR_NUMBER/$env:HEAD_SHA"
          $screens = @(Get-Content artifacts/e2e/screens.json -Raw | ConvertFrom-Json)
          if ($screens.Count -eq 0) { throw 'La prueba no generó capturas.' }

          # Las capturas se guardan en una rama aparte (sin historial del código)
          # para poder enlazarlas como imagen en el comentario.
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --depth 1 origin $branch 2>$null
          if ($LASTEXITCODE -eq 0) {
            git worktree add shots FETCH_HEAD
            Push-Location shots
            git checkout -B $branch
          }
          else {
            git worktree add --detach shots
            Push-Location shots
            git checkout --orphan $branch
            git rm -rf --quiet .
          }
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item ../artifacts/e2e/screens/*.png $folder
          git add $folder
          git commit --quiet -m "E2E: capturas de PR #$env:PR_NUMBER ($env:HEAD_SHA)"
          git push --quiet origin "HEAD:$branch"
          if ($LASTEXITCODE -ne 0) { throw 'No se pudieron publicar las capturas.' }
          Pop-Location

          # One comment with every screen: the main window first, then the rest.
          $report = Get-Content artifacts/e2e/report.md -Raw
          $marker = '<!-- e2e-smoke -->'
          $base = "https://raw.githubusercontent.com/$env:REPO/$branch/$folder"
          $images = foreach ($screen in $screens) {
            "#### $($screen.title)`n`n![$($screen.title)]($base/$($screen.file))`n"
          }
          $body = "$marker`n$report`n" + ($images -join "`n") + "`nCommit $env:HEAD_SHA · [ejecución]($env:RUN_URL)"

          # Un único comentario por PR, actualizado en cada ejecución.
          $existing = gh api "repos/$env:REPO/issues/$env:PR_NUMBER/comments" --paginate --jq ".[] | select(.body | startswith(`"$marker`")) | .id" | Select-Object -First 1
          $payload = @{ body = $body } | ConvertTo-Json
          if ($existing) {
            $payload | gh api -X PATCH "repos/$env:REPO/issues/comments/$existing" --input - | Out-Null
          }
          else {
            $payload | gh api -X POST "repos/$env:REPO/issues/$env:PR_NUMBER/comments" --input - | Out-Null
          }
