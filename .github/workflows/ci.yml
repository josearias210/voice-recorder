name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build & Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build VoiceRecorder.slnx -c Release -warnaserror --nologo

      - name: Test
        run: >-
          dotnet test tests/VoiceRecorder.Tests -c Release --no-build --nologo
          --logger "console;verbosity=normal"
          --logger "trx" --results-directory "artifacts/test-results"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.sha }}
          path: artifacts/test-results/**/*.trx
          retention-days: 14
          if-no-files-found: error

      - name: Publish (portable build)
        run: dotnet publish src/VoiceRecorder.App/VoiceRecorder.App.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Smoke test del portable
        shell: pwsh
        run: |
          $required = @(
            'publish/VoiceRecorder.exe',
            'publish/VoiceRecorder.dll',
            'publish/VoiceRecorder.Transcription.dll',
            'publish/VoiceRecorder.Audio.dll',
            'publish/VoiceRecorder.Storage.dll',
            'publish/Whisper.net.dll',
            'publish/onnxruntime.dll',
            'publish/e_sqlite3.dll'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Faltan ensamblados en el portable: $($missing -join ', ')" }
          Write-Host "Portable OK: $((Get-ChildItem publish | Measure-Object).Count) archivos"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceRecorder-portable-${{ github.sha }}
          path: publish/
          retention-days: 14
