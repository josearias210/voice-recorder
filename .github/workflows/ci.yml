name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build VoiceRecorder.slnx -c Release

      - name: Test
        run: dotnet test tests/VoiceRecorder.Tests -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish (portable build)
        run: dotnet publish src/VoiceRecorder.App/VoiceRecorder.App.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceRecorder-portable-${{ github.sha }}
          path: publish/
          retention-days: 14
