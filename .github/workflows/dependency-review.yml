name: Dependency review

# En cada PR, compara las dependencias (NuGet y acciones) con la base de datos
# de vulnerabilidades de GitHub y falla si se introduce una con severidad alta
# o una licencia incompatible con la distribución del proyecto.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Revisar dependencias
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0-only, GPL-3.0-or-later
          comment-summary-in-pr: on-failure
