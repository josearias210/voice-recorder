# Actualizaciones automáticas de dependencias. Cada PR pasa por el CI normal
# antes de poder fusionarse. Las actualizaciones menores y de parche se agrupan
# para no generar un PR por paquete.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
    ignore:
      # System.Speech 11+ exige net10.0 o superior; el proyecto apunta a net8.0.
      - dependency-name: System.Speech
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # El runtime debe coincidir con el TargetFramework (net8.0) y el SDK con
      # el que usa el CI (10.0.x): las versiones mayores se cambian a mano.
      - dependency-name: dotnet/runtime
        update-types: [version-update:semver-major]
      - dependency-name: dotnet/sdk
        update-types: [version-update:semver-major]
