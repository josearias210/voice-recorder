# Actualizaciones automáticas de dependencias. Cada PR pasa por el CI normal
# antes de poder fusionarse. Las actualizaciones menores y de parche se agrupan
# para no generar un PR por paquete.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # El SDK debe coincidir con el TargetFramework (net10.0) y con el que usa
      # el CI (10.0.x): las versiones mayores se cambian a mano.
      - dependency-name: dotnet/sdk
        update-types: [version-update:semver-major]
