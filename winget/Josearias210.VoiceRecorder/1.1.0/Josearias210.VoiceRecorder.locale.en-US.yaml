ShortDescription: Real-time, fully local transcription for any call app on Windows.
Description: |-
  Voice Recorder transcribes your calls in real time, from any application
  (Meet, Teams, Zoom, WhatsApp Web...) using system-level audio capture,
  Silero VAD for speaker attribution (Me / Them) and local Whisper speech
  recognition. No cloud, no virtual audio drivers, and the audio is never
  saved: only the transcript.
